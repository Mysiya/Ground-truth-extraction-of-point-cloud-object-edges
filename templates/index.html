<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点云边缘真值提取平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header class="navbar">
    <div class="navbar-brand">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/>
            <line x1="12" y1="22" x2="12" y2="15.5"/>
            <polyline points="22 8.5 12 15.5 2 8.5"/>
        </svg>
        <span>点云边缘真值提取平台</span>
    </div>
    <div class="navbar-subtitle">Ground Truth Edge Extraction Platform</div>
</header>

<main class="main-container">

    <!-- ========== 左侧面板 ========== -->
    <aside class="panel" id="controlPanel">

        <!-- 上传 -->
        <section class="card">
            <h2 class="card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                上传 OBJ 文件
            </h2>
            <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon" id="uploadIcon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                </div>
                <p class="upload-text" id="uploadText">拖拽 .obj 文件到此处或点击选择</p>
                <input type="file" id="fileInput" accept=".obj" style="display:none">
                <div class="file-info" id="fileInfo" style="display:none;">
                    <span class="file-name" id="fileName"></span>
                    <button class="btn-icon" id="clearFileBtn" onclick="event.stopPropagation();clearFile();">&times;</button>
                </div>
            </div>
            <div class="upload-status" id="uploadStatus"></div>
        </section>

        <!-- 参数 -->
        <section class="card">
            <h2 class="card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v2M12 21v2"/>
                </svg>
                提取参数
            </h2>
            <div class="param-group">
                <label class="param-label">二面角阈值 <span class="param-value" id="angleValue">25.0°</span></label>
                <input type="range" id="angleThreshold" min="1" max="90" value="25" step="0.5"
                       oninput="document.getElementById('angleValue').textContent=parseFloat(this.value).toFixed(1)+'°'">
                <p class="param-desc">相邻面夹角超过此值判定为尖锐边缘。值越小，边缘越多。</p>
            </div>
            <div class="param-group">
                <label class="param-label">采样密度 <span class="param-value" id="densityValue">50.0 点/单位</span></label>
                <input type="range" id="sampleDensity" min="5" max="200" value="50" step="1"
                       oninput="document.getElementById('densityValue').textContent=parseFloat(this.value).toFixed(1)+' 点/单位'">
                <p class="param-desc">每单位长度采样点数，影响边缘点云密度。</p>
            </div>
            <div class="param-group">
                <label class="param-label">最小采样点 <span class="param-value" id="minSamplesValue">2</span></label>
                <input type="range" id="minSamples" min="1" max="20" value="2" step="1"
                       oninput="document.getElementById('minSamplesValue').textContent=this.value">
                <p class="param-desc">每条边最少采样点数，避免极短边无点。</p>
            </div>
            <button class="btn btn-primary" id="extractBtn" disabled onclick="doExtract()">
                提取边缘
            </button>
            <div class="extract-status" id="extractStatus"></div>
        </section>

        <!-- 统计 -->
        <section class="card" id="statsCard" style="display:none;">
            <h2 class="card-title">统计信息</h2>
            <div class="stats-grid" id="statsGrid"></div>
        </section>

        <!-- 下载 -->
        <section class="card" id="downloadCard" style="display:none;">
            <h2 class="card-title">下载结果</h2>
            <div class="download-buttons">
                <button class="btn btn-download" id="downloadPlyBtn" onclick="downloadResult('ply')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    边缘点云 .ply
                </button>
                <button class="btn btn-download" id="downloadTxtBtn" onclick="downloadResult('txt')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                    边缘线段 .txt
                </button>
            </div>
        </section>
    </aside>

    <!-- ========== 右侧 3D 视图 ========== -->
    <section class="viewer" id="viewerContainer">
        <div class="viewer-toolbar" id="viewerToolbar" style="display:none;">
            <label class="toggle-label"><input type="checkbox" id="toggleMesh" checked onchange="toggleLayer('mesh',this.checked)"> 网格</label>
            <label class="toggle-label"><input type="checkbox" id="toggleEdges" checked onchange="toggleLayer('edges',this.checked)"> 边缘线</label>
            <label class="toggle-label"><input type="checkbox" id="togglePoints" checked onchange="toggleLayer('points',this.checked)"> 边缘点</label>
            <span class="toolbar-spacer"></span>
            <button class="btn-icon" id="resetCameraBtn" title="重置视角" onclick="resetCamera()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
                </svg>
            </button>
        </div>
        <div class="viewer-canvas" id="viewerCanvas">
            <div class="viewer-placeholder" id="viewerPlaceholder">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="opacity:0.3;margin-bottom:16px;">
                    <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/>
                    <line x1="12" y1="22" x2="12" y2="15.5"/>
                </svg>
                <p>上传 OBJ 文件并点击"提取边缘"开始</p>
                <p class="viewer-hint">支持旋转/缩放/平移查看</p>
            </div>
        </div>
        <div class="viewer-legend" id="viewerLegend" style="display:none;">
            <span class="legend-item"><span class="legend-color" style="background:#aaa;"></span> 网格线框</span>
            <span class="legend-item"><span class="legend-color" style="background:#ff4444;"></span> 尖锐边缘</span>
            <span class="legend-item"><span class="legend-color" style="background:#ffaa00;"></span> 边缘采样点</span>
        </div>
    </section>
</main>

<!-- Loading Overlay -->
<div class="overlay" id="loadingOverlay" style="display:none;">
    <div class="spinner"></div>
    <p id="loadingText">处理中...</p>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<!-- ================================================================ -->
<!-- 核心交互逻辑 — 内联脚本，不依赖任何 CDN                          -->
<!-- ================================================================ -->
<script>
// ---- 全局状态 ----
var SESSION_ID = null;

// ---- 辅助函数 ----
function showLoading(msg) {
    document.getElementById('loadingText').textContent = msg;
    document.getElementById('loadingOverlay').style.display = 'flex';
}
function hideLoading() {
    document.getElementById('loadingOverlay').style.display = 'none';
}

function toast(msg, type) {
    var el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.textContent = msg;
    document.getElementById('toastContainer').appendChild(el);
    setTimeout(function() {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.3s';
        setTimeout(function() { el.remove(); }, 300);
    }, 3500);
}

function showStats(stats) {
    var items = [
        ['顶点数', stats.vertex_count],
        ['三角面数', stats.face_count],
        ['尖锐边缘', stats.sharp_edge_count],
        ['边界边', stats.boundary_count],
        ['二面角边缘', stats.dihedral_count],
        ['边缘采样点', stats.edge_point_count],
    ];
    var html = '';
    items.forEach(function(item) {
        html += '<div class="stat-item"><div class="stat-value">' + item[1].toLocaleString() + '</div><div class="stat-label">' + item[0] + '</div></div>';
    });
    document.getElementById('statsGrid').innerHTML = html;
    document.getElementById('statsCard').style.display = '';
}

function downloadResult(type) {
    if (SESSION_ID) {
        window.open('/api/download/' + SESSION_ID + '/' + type, '_blank');
    }
}

// ---- 文件处理 ----
var fileInput = document.getElementById('fileInput');
var uploadZone = document.getElementById('uploadZone');

fileInput.addEventListener('change', function() {
    if (this.files.length > 0) handleFile(this.files[0]);
});

// 拖拽事件
uploadZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    this.classList.add('dragover');
});
uploadZone.addEventListener('dragleave', function() {
    this.classList.remove('dragover');
});
uploadZone.addEventListener('drop', function(e) {
    e.preventDefault();
    this.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
    if (!file.name.toLowerCase().endsWith('.obj')) {
        toast('仅支持 .obj 文件', 'error');
        return;
    }

    document.getElementById('fileName').textContent = file.name;
    document.getElementById('fileInfo').style.display = 'flex';
    document.getElementById('uploadIcon').style.display = 'none';
    document.getElementById('uploadText').style.display = 'none';
    uploadZone.classList.add('has-file');

    uploadFile(file);
}

function clearFile() {
    SESSION_ID = null;
    fileInput.value = '';
    document.getElementById('fileInfo').style.display = 'none';
    document.getElementById('uploadIcon').style.display = '';
    document.getElementById('uploadText').style.display = '';
    uploadZone.classList.remove('has-file');
    document.getElementById('uploadStatus').textContent = '';
    document.getElementById('extractStatus').textContent = '';
    document.getElementById('extractBtn').disabled = true;
    document.getElementById('statsCard').style.display = 'none';
    document.getElementById('downloadCard').style.display = 'none';
    // 通知 3D 查看器清除
    if (window.viewerClear) window.viewerClear();
}

// ---- API 调用 ----
function uploadFile(file) {
    showLoading('正在上传并解析 OBJ 文件...');
    var fd = new FormData();
    fd.append('file', file);

    fetch('/api/upload', { method: 'POST', body: fd })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            hideLoading();
            if (!data.success) {
                document.getElementById('uploadStatus').textContent = data.error;
                document.getElementById('uploadStatus').className = 'upload-status error';
                toast(data.error, 'error');
                return;
            }
            SESSION_ID = data.session_id;
            document.getElementById('uploadStatus').textContent = '✓ 上传成功 — ' + data.vertex_count.toLocaleString() + ' 顶点, ' + data.face_count.toLocaleString() + ' 面';
            document.getElementById('uploadStatus').className = 'upload-status success';
            document.getElementById('extractBtn').disabled = false;
            // 自动提取
            doExtract();
        })
        .catch(function(err) {
            hideLoading();
            toast('上传失败: ' + err.message, 'error');
        });
}

function doExtract() {
    if (!SESSION_ID) { toast('请先上传 OBJ 文件', 'error'); return; }

    var params = {
        session_id: SESSION_ID,
        angle_threshold: parseFloat(document.getElementById('angleThreshold').value),
        sample_density: parseFloat(document.getElementById('sampleDensity').value),
        min_samples: parseInt(document.getElementById('minSamples').value),
    };

    showLoading('正在提取边缘...');

    fetch('/api/extract', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(params),
    })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            hideLoading();
            if (!data.success) {
                document.getElementById('extractStatus').textContent = data.error;
                document.getElementById('extractStatus').className = 'extract-status error';
                toast(data.error, 'error');
                return;
            }
            document.getElementById('extractStatus').textContent = '✓ 提取完成 — ' + data.stats.sharp_edge_count + ' 条边缘, ' + data.stats.edge_point_count.toLocaleString() + ' 个点';
            document.getElementById('extractStatus').className = 'extract-status success';
            showStats(data.stats);
            document.getElementById('downloadCard').style.display = '';
            document.getElementById('viewerPlaceholder').style.display = 'none';
            document.getElementById('viewerToolbar').style.display = 'flex';
            document.getElementById('viewerLegend').style.display = 'flex';
            // 通知 3D 查看器渲染
            if (window.viewerRender) window.viewerRender(data);
        })
        .catch(function(err) {
            hideLoading();
            toast('提取失败: ' + err.message, 'error');
        });
}

// ---- 3D 查看器桥接函数 (供 viewer.js module 调用) ----
function toggleLayer(layer, visible) {
    if (window.viewerToggle) window.viewerToggle(layer, visible);
}
function resetCamera() {
    if (window.viewerReset) window.viewerReset();
}

console.log('[平台] 核心交互逻辑已就绪');
</script>

<!-- ================================================================ -->
<!-- Three.js 3D 查看器 — ES Module，可能较慢加载                      -->
<!-- ================================================================ -->
<script type="module">
// 将 3D 查看器暴露给内联脚本
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

console.log('[3D] Three.js 加载成功，初始化查看器...');

var scene, camera, renderer, controls;
var meshGroup, edgeGroup, pointGroup;
var defaultCamPos, defaultTarget;
var sceneReady = false;

function initScene() {
    if (sceneReady) return;
    var canvas = document.getElementById('viewerCanvas');

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f0f1a);

    var rect = canvas.getBoundingClientRect();
    camera = new THREE.PerspectiveCamera(50, rect.width / Math.max(rect.height, 1), 0.1, 1000);
    camera.position.set(8, 6, 10);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(rect.width, rect.height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    canvas.appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);
    controls.update();

    scene.add(new THREE.AmbientLight(0x404060, 1.5));
    var dl = new THREE.DirectionalLight(0xffffff, 2);
    dl.position.set(10, 20, 10);
    scene.add(dl);
    var dl2 = new THREE.DirectionalLight(0x8888cc, 0.8);
    dl2.position.set(-10, -2, -5);
    scene.add(dl2);

    scene.add(new THREE.GridHelper(20, 20, 0x333355, 0x1a1a2e));
    scene.add(new THREE.AxesHelper(3));

    meshGroup = new THREE.Group();
    edgeGroup = new THREE.Group();
    pointGroup = new THREE.Group();
    scene.add(meshGroup);
    scene.add(edgeGroup);
    scene.add(pointGroup);

    defaultCamPos = camera.position.clone();
    defaultTarget = controls.target.clone();

    window.addEventListener('resize', function() {
        if (!renderer) return;
        var r = canvas.getBoundingClientRect();
        camera.aspect = r.width / Math.max(r.height, 1);
        camera.updateProjectionMatrix();
        renderer.setSize(r.width, r.height);
    });

    sceneReady = true;
    (function loop() {
        requestAnimationFrame(loop);
        controls.update();
        renderer.render(scene, camera);
    })();
}

function disposeGroup(g) {
    while (g.children.length) {
        var c = g.children[0];
        if (c.geometry) c.geometry.dispose();
        if (c.material) {
            var mats = Array.isArray(c.material) ? c.material : [c.material];
            mats.forEach(function(m) { m.dispose(); });
        }
        g.remove(c);
    }
}

function clearSceneObjs() {
    [meshGroup, edgeGroup, pointGroup].forEach(disposeGroup);
}

function renderMesh(meshData) {
    var verts = new Float32Array(meshData.vertices.flat());
    var idx = meshData.faces.flat();
    var geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(verts, 3));
    geom.setIndex(idx);
    geom.computeVertexNormals();

    var faceMat = new THREE.MeshPhongMaterial({
        color: 0x334466, transparent: true, opacity: 0.12,
        side: THREE.DoubleSide, depthWrite: false,
    });
    meshGroup.add(new THREE.Mesh(geom, faceMat));

    var eGeom = new THREE.EdgesGeometry(geom, 30);
    meshGroup.add(new THREE.LineSegments(eGeom,
        new THREE.LineBasicMaterial({ color: 0x888899, transparent: true, opacity: 0.45 })));
}

function renderEdges(edgeData) {
    var pos = [];
    edgeData.segments.forEach(function(s) {
        pos.push(s.start[0], s.start[1], s.start[2], s.end[0], s.end[1], s.end[2]);
    });
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
    edgeGroup.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xff4444 })));

    if (edgeData.points && edgeData.points.length) {
        var pf = new Float32Array(edgeData.points.flat());
        var pg = new THREE.BufferGeometry();
        pg.setAttribute('position', new THREE.BufferAttribute(pf, 3));
        var cvs = document.createElement('canvas');
        cvs.width = cvs.height = 16;
        var ctx = cvs.getContext('2d');
        ctx.fillStyle = '#ffaa00';
        ctx.beginPath(); ctx.arc(8, 8, 4, 0, Math.PI * 2); ctx.fill();
        pointGroup.add(new THREE.Points(pg, new THREE.PointsMaterial({
            size: 0.06, map: new THREE.CanvasTexture(cvs),
            blending: THREE.AdditiveBlending, depthWrite: false, color: 0xffaa00,
        })));
    }
}

function fitCamera(bbox) {
    if (!bbox) return;
    var size = Math.max(bbox.size[0], bbox.size[1], bbox.size[2]);
    var dist = size * 2.5;
    var cx = bbox.center[0], cy = bbox.center[1], cz = bbox.center[2];
    controls.target.set(cx, cy, cz);
    camera.position.set(cx + dist * 0.7, cy + dist * 0.5, cz + dist * 0.7);
    controls.update();
    defaultCamPos = camera.position.clone();
    defaultTarget = controls.target.clone();

    var oldGrid = scene.children.find(function(c) { return c.isGridHelper; });
    if (oldGrid) scene.remove(oldGrid);
    var grid = new THREE.GridHelper(size * 3, 20, 0x333355, 0x1a1a2e);
    grid.position.set(cx, bbox.min[1] - size * 0.05, cz);
    scene.add(grid);
}

// ---- 暴露给全局的桥接函数 ----
window.viewerRender = function(data) {
    initScene();
    clearSceneObjs();
    if (data.mesh_data) renderMesh(data.mesh_data);
    if (data.edge_data) renderEdges(data.edge_data);
    if (data.bbox) fitCamera(data.bbox);
};

window.viewerClear = function() {
    if (sceneReady) clearSceneObjs();
    document.getElementById('viewerPlaceholder').style.display = '';
    document.getElementById('viewerToolbar').style.display = 'none';
    document.getElementById('viewerLegend').style.display = 'none';
};

window.viewerToggle = function(layer, visible) {
    if (layer === 'mesh') meshGroup.visible = visible;
    if (layer === 'edges') edgeGroup.visible = visible;
    if (layer === 'points') pointGroup.visible = visible;
};

window.viewerReset = function() {
    if (defaultCamPos && defaultTarget) {
        camera.position.copy(defaultCamPos);
        controls.target.copy(defaultTarget);
        controls.update();
    }
};

console.log('[3D] 查看器就绪，等待数据...');
</script>

</body>
</html>
